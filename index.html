<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desktop Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- ============ 顶部栏 ============ -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Desktop Chat</span>
      </div>

      <div class="topbar-actions">
        <!-- 项目选择下拉 -->
        <div class="dropdown" id="projectDropdown">
          <button class="dropdown-btn" id="projectBtn">
            <span id="projectLabel">默认项目</span>
            <svg class="chevron" viewBox="0 0 16 16" width="14" height="14">
              <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="dropdown-menu" id="projectMenu">
            <div id="projectList"></div>
            <div class="dropdown-sep"></div>
            <button class="dropdown-item" id="newProjectBtn">
              <span class="item-title">＋ 新建项目</span>
            </button>
            <button class="dropdown-item" id="manageProjectBtn">
              <span class="item-title">项目设置 · 知识库…</span>
            </button>
          </div>
        </div>

        <!-- 模型选择下拉 -->
        <div class="dropdown" id="modelDropdown">
          <button class="dropdown-btn" id="modelBtn">
            <span id="modelLabel">DeepSeek V4 PRO</span>
            <svg class="chevron" viewBox="0 0 16 16" width="14" height="14">
              <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="dropdown-menu" id="modelMenu">
            <button class="dropdown-item" data-model="deepseek-v4-pro">
              <span class="item-title">DeepSeek V4 PRO</span>
              <span class="item-desc">最新旗舰</span>
            </button>
            <button class="dropdown-item" data-model="deepseek-chat">
              <span class="item-title">DeepSeek-V3</span>
              <span class="item-desc">通用对话 · 快速</span>
            </button>
            <button class="dropdown-item" data-model="deepseek-reasoner">
              <span class="item-title">DeepSeek-R1</span>
              <span class="item-desc">深度推理 · 更强</span>
            </button>
            <button class="dropdown-item" data-model="glm-4-flash">
              <span class="item-title">智谱 GLM-4-Flash</span>
              <span class="item-desc">免费 · 快速</span>
            </button>
          </div>
        </div>

        <!-- 设置（齿轮）按钮 -->
        <button class="icon-btn" id="settingsBtn" title="设置">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.98 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.98a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.13.5.5.9 1.03 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z" fill="none" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ============ 对话区 ============ -->
    <main class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="welcome-logo">
          <span class="brand-dot big"></span>
        </div>
        <h2>你好，我是 Desktop Chat</h2>
        <p>开始对话吧，输入内容后按 Enter 发送</p>
      </div>
    </main>

    <!-- ============ 底部输入区 ============ -->
    <footer class="composer">
      <!-- 待发送的附件标签（默认空） -->
      <div class="attachments" id="attachments"></div>
      <div class="composer-inner">
        <!-- 附件按钮（回形针） -->
        <button class="icon-btn attach-btn" id="attachBtn" title="添加文件 / 图片">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path d="M21.4 11.1l-8.5 8.5a5 5 0 0 1-7.1-7.1l9.2-9.2a3.3 3.3 0 0 1 4.7 4.7l-9.2 9.2a1.7 1.7 0 0 1-2.4-2.4l8.5-8.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
        <!-- 语音输入按钮 -->
        <button class="icon-btn" id="micBtn" title="语音输入">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3z" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M19 11a7 7 0 0 1-14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
        <textarea id="input" rows="1" placeholder="给 Desktop Chat 发送消息…"></textarea>
        <button class="send-btn" id="sendBtn" title="发送">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path d="M4 12l16-7-7 16-2-7-7-2z" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div class="composer-hint">Enter 发送 · Shift + Enter 换行</div>
      <div class="mic-state" id="micState"></div>
    </footer>
  </div>

  <!-- ============ 设置弹窗（API Key） ============ -->
  <div class="modal-overlay" id="settingsModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3>设置</h3>
        <button class="icon-btn" id="closeSettingsBtn">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field-label" for="apiKeyInput">DeepSeek API Key</label>
        <input class="field-input" id="apiKeyInput" type="password" placeholder="sk-…" autocomplete="off" />

        <label class="field-label" for="doubaoApiKeyInput">豆包 API Key（语音识别）</label>
        <input class="field-input" id="doubaoApiKeyInput" type="password" placeholder="豆包语音控制台的 API Key" autocomplete="off" />

        <label class="field-label" for="glmApiKeyInput">智谱 GLM API Key（文字对话，免费模型）</label>
        <input class="field-input" id="glmApiKeyInput" type="password" placeholder="智谱 open.bigmodel.cn 的 API Key" autocomplete="off" />

        <p class="field-hint">密钥都只保存在本机：DeepSeek / 智谱 GLM 用于文字对话，豆包 API Key 用于语音识别。</p>
        <a class="field-link" href="#" id="keyLink">还没有 DeepSeek Key？前往 platform.deepseek.com 获取</a>
      </div>
      <div class="modal-foot">
        <button class="btn-ghost" id="cancelBtn">取消</button>
        <button class="btn-primary" id="saveBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- ============ 项目管理弹窗 ============ -->
  <div class="modal-overlay" id="projectModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3>项目管理</h3>
        <button class="icon-btn" id="closeProjectBtn">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field-label" for="projectNameInput">项目名称</label>
        <input class="field-input" id="projectNameInput" placeholder="给这个项目起个名字" />

        <label class="field-label" for="systemPromptInput">前置提示（系统提示词）</label>
        <textarea class="field-input field-textarea" id="systemPromptInput" rows="4" placeholder="例如：你是一个专业的中英翻译助手，回答要简洁准确。"></textarea>

        <label class="field-label">知识库（添加文件，回答时作为参考）</label>
        <div class="kb-list" id="kbList"></div>
        <button class="btn-ghost btn-small" id="addKbBtn">＋ 添加知识库文件</button>

        <div class="modal-danger">
          <button class="btn-danger" id="deleteProjectBtn">删除当前项目</button>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-ghost" id="cancelProjectBtn">取消</button>
        <button class="btn-primary" id="saveProjectBtn">保存</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
  <!-- 语音输入模块（豆包 Seed-ASR） -->
  <script type="module" src="./voice.js"></script>
</body>
</html>
